<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 키프레임 애니메이션</title>
    <link rel="shortcut icon" href="/public/favicon/likelion.ico" type="image/x-icon" />
    <link rel="icon" href="/public/favicon/likelion.svg" type="image/svg" />
    <link rel="stylesheet" href="/src/common/index.css" />
    <link rel="stylesheet" href="/src/css/styles/20-keyframes.css" />
    <script type="module" src="/src/css/js/20-keyframes.js"></script>
  </head>
  <body>
    <a href="/index.html">메인 페이지</a><br />
    <h1>CSS 키프레임 애니메이션</h1>
    <hr style="margin: 20px 0 40px" />
    <div class="like" hidden>멋쟁이 사자처럼</div>
    <div class="container">
      <div class="case rotateMix">
        <strong>Rotate Mix (css변수를 활용한 애니메이션)</strong>
        <div class="controls">
          <button type="button" class="reset-animation button">초기화</button>
          <button type="button" class="toggle-animation button">재생</button>
        </div>
        <div class="target-animation"></div>
      </div>
      <div class="case fade">
        <strong>Fade</strong>
        <div class="controls">
          <button type="button" class="reset-animation button">초기화</button>
          <button type="button" class="toggle-animation button">재생</button>
        </div>
        <div class="target-animation">멋쟁이</div>
      </div>
      <div class="case shrink">
        <strong>Shrink</strong>
        <div class="controls">
          <button type="button" class="reset-animation button">초기화</button>
          <button type="button" class="toggle-animation button">재생</button>
        </div>
        <div class="target-animation">멋쟁이</div>
      </div>
      <div class="case bounce">
        <strong>Bounce</strong>
        <div class="controls">
          <button type="button" class="reset-animation button">초기화</button>
          <button type="button" class="toggle-animation button">재생</button>
        </div>
        <div class="target-animation">멋쟁이</div>
      </div>
      <div class="case shake">
        <strong>Shake</strong>
        <div class="controls">
          <button type="button" class="reset-animation button">초기화</button>
          <button type="button" class="toggle-animation button">재생</button>
        </div>
        <div class="target-animation">멋쟁이</div>
      </div>
      <div class="case spin">
        <strong>Spin</strong>
        <div class="controls">
          <button type="button" class="reset-animation button">초기화</button>
          <button type="button" class="toggle-animation button">재생</button>
        </div>
        <div class="target-animation"></div>
      </div>
      <div class="case pulse">
        <strong>Pulse</strong>
        <div class="controls">
          <button type="button" class="reset-animation button">초기화</button>
          <button type="button" class="toggle-animation button">재생</button>
        </div>
        <div class="target-animation">멋쟁이</div>
      </div>
      <div class="case flip">
        <strong>Flip</strong>
        <div class="controls">
          <button type="button" class="reset-animation button">초기화</button>
          <button type="button" class="toggle-animation button">재생</button>
        </div>
        <div class="target-animation">멋쟁이</div>
      </div>
      <div class="case wobble">
        <strong>Wobble</strong>
        <div class="controls">
          <button type="button" class="reset-animation button">초기화</button>
          <button type="button" class="toggle-animation button">재생</button>
        </div>
        <div class="target-animation">멋쟁이</div>
      </div>
    </div>
  </body>
</html>
