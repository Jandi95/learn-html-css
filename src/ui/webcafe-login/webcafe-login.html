<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebCafe</title>
    <link rel="shortcut icon" href="/public/favicon/likelion.ico" type="image/x-icon" />
    <link rel="icon" href="/public/favicon/likelion.svg" type="image/svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" />
    <link rel="stylesheet" href="/src/common/index.css" />
    <link rel="stylesheet" href="/src/ui/webcafe-login/webcafe-login.css" />
  </head>
  <body>
    <a href="/index.html">메인 페이지</a><br />
    <hr />
    <h1>WebCafe</h1>
    <hr />
    <h2>컴포넌트 마크업</h2>
    <div class="component_wrap">
      <!-- 입력서식 컴포넌트 -->
      <div class="form_input">
        <label for="formInput0">텍스트</label>
        <input id="formInput0" name="폼네임" type="타입지정" placeholder="플레이스홀더" required />
      </div>
      <!-- 버튼 컴포넌트 -->
      <div class="form_button">
        <button type="타입지정">텍스트</button>
      </div>
      <div class="form_button fill">
        <button type="타입지정">텍스트</button>
      </div>
      <!-- 하이퍼링크 컴포넌트 -->
      <div class="link_button">
        <i class="fas fa-angle-right"></i>
        <a href="#">텍스트</a>
      </div>
    </div>
    <hr />
    <h2>웹카페 로그인 폼</h2>
    <div class="webcafe_login">
      <h3 class="headline">로그인</h3>
      <form action="/" method="GET">
        <div class="form_input">
          <label for="formInput1">아이디</label>
          <input id="formInput1" name="userEmail" type="email" placeholder="euid@euid.dev" required />
        </div>
        <div class="form_input">
          <label for="formInput2">비밀번호</label>
          <input id="formInput2" name="userPwd" type="password" placeholder="8자리 이상" minlength="8" required />
        </div>
        <div class="form_button fill">
          <button type="submit">로그인</button>
        </div>
      </form>
      <div class="hyperlink">
        <div class="link_button">
          <i class="fas fa-angle-right"></i>
          <a href="#">회원가입</a>
        </div>
        <div class="link_button">
          <i class="fas fa-angle-right"></i>
          <a href="#">아이디 비밀번호 찾기</a>
        </div>
      </div>
    </div>
  </body>
</html>
